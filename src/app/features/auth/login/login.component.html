<div class="container-fluid bg-light vh-100 d-flex justify-content-center align-items-center">
  
  <div class="card shadow-lg border-0" style="width: 100%; max-width: 420px; border-radius: 12px;">
    <div class="card-body p-5">
      
      <div class="text-center mb-4">
        <h2 class="fw-bold text-primary">Iniciar Sesión</h2>
        <p class="text-muted">Accede a tu panel de conciliación</p>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger text-center" role="alert">
        {{ errorMessage }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
          <input 
            id="email" 
            type="email" 
            class="form-control form-control-lg" 
            formControlName="email" 
            placeholder="usuario@empresa.com"
            [ngClass]="{'is-invalid': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}"
          />
          <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="invalid-feedback">
            Ingresa un correo electrónico válido.
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label fw-semibold">Contraseña</label>
          <input 
            id="password" 
            type="password" 
            class="form-control form-control-lg" 
            formControlName="password" 
            placeholder="••••••••"
            [ngClass]="{'is-invalid': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}"
          />
          <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="invalid-feedback">
            La contraseña es requerida y debe tener al menos 6 caracteres.
          </div>
        </div>

        <button 
          type="submit" 
          class="btn btn-primary btn-lg w-100 fw-bold" 
          [disabled]="loginForm.invalid || isLoading"
        >
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          {{ isLoading ? 'Autenticando...' : 'Ingresar' }}
        </button>

      </form>
    </div>
  </div>
</div>
