<div class="bg-white rounded-lg shadow overflow-hidden">
    <div class="p-5 border-b border-gray-100">
      <h3 class="text-lg font-bold text-gray-800">Historial de Ejecuciones</h3>
    </div>
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID Proceso</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Fecha</th>
            <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase">Movimientos</th>
            <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase">Conciliados</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Monto Total</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Estado</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200 text-sm text-gray-700">
          <tr *ngFor="let item of historyList" class="hover:bg-gray-50 transition">
            <td class="px-6 py-4 font-mono font-semibold text-indigo-600">{{ item.id }}</td>
            <td class="px-6 py-4">{{ item.executionDate | date:'short' }}</td>
            <td class="px-6 py-4 text-center">{{ item.totalTransactions }}</td>
            <td class="px-6 py-4 text-center text-green-600 font-semibold">{{ item.matchedTransactions }}</td>
            <td class="px-6 py-4 font-medium text-gray-900">{{ item.totalAmount | currency }}</td>
            <td class="px-6 py-4">
              <span class="px-2.5 py-1 rounded-full text-xs font-medium"
                [ngClass]="item.status === 'Completado' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'">
                {{ item.status }}
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
